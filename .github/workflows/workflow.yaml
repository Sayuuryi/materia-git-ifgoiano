name: Continuous Integration

on:
  push:
  pull_request:

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-build-

      - name: Run automated tests
        run: npm run test:ci

      - name: Build application
        run: npm run build

      - name: Generate documentation
        run: npm run generate-docs

      - name: Create build report
        if: always()
        run: |
          {
            echo "## Continuous Integration"
            echo ""
            echo "- Node.js: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- Dependencies: npm ci"
            echo "- Build cache: node_modules/.cache"
            echo "- Tests: npm run test:ci"
            echo "- Build: npm run build"
            echo "- Documentation: npm run generate-docs"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: build/
          if-no-files-found: error

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage
          path: coverage/
          if-no-files-found: warn

      - name: Upload generated documentation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-documentation
          path: docs/
          if-no-files-found: error
