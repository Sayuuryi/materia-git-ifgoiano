name: Continuous Integration

on: pull_request

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Using Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.
      - name: run install, build and test
        run: |
          npm install
          npm run build
          npm run test
